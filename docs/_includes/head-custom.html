<style>
  :root { color-scheme: light dark; }

  /* Automatic dark mode: follows the visitor's system/browser theme.
     The charts below switch with <picture media="(prefers-color-scheme: dark)">. */
  @media (prefers-color-scheme: dark) {
    body {
      background-color: #0f172a;
      color: #e2e8f0;
    }
    a, a:visited { color: #93c5fd; }
    a:hover { color: #bfdbfe; }
    h1, h2, h3, h4, h5, h6 { color: #f1f5f9; }
    hr { border-color: #1e293b; }
    blockquote {
      color: #94a3b8;
      border-left-color: #334155;
    }
    code {
      background-color: #1e293b;
      border-color: #334155;
      color: #e2e8f0;
    }
    pre {
      background-color: #1e293b;
      border-color: #334155;
    }
    pre > code { background-color: transparent; }
    table { color: #e2e8f0; }
    table th, table td { border-color: #334155; }
    table tr:nth-child(even) { background-color: #16213a; }
    table th { background-color: #1e293b; }
    .site-header {
      border-top-color: #334155;
      border-bottom-color: #1e293b;
    }
    .site-title, .site-title:visited { color: #f1f5f9; }
    .site-nav .page-link { color: #cbd5e1; }
    .site-footer {
      border-top-color: #1e293b;
      color: #94a3b8;
    }
    .site-footer a, .site-footer a:visited { color: #93c5fd; }
    .highlight, figure.highlight { background-color: #1e293b; }
    img { opacity: 0.98; }
  }

  /* Charts: full width, no visual seams on either theme. */
  .chart { margin: 1.25rem 0 2rem; }
  .chart img { width: 100%; height: auto; display: block; }
  .chart figcaption {
    font-size: 0.85rem;
    opacity: 0.75;
    margin-top: 0.4rem;
  }
</style>
