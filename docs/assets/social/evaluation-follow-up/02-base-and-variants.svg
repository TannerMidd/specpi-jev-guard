<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" font-family="'Segoe UI', 'DejaVu Sans', sans-serif">
<title>Base cases and their variants.</title><desc>New plain cases: Jev API 1/120 unexpected allows and 15/120 control interruptions; Laya GPU 40/120 unexpected allows and 37/120 control interruptions. Nested Bash: Jev API 2/108 unexpected allows and 15/108 control interruptions; Laya GPU 20/108 unexpected allows and 61/108 control interruptions. Encoded PowerShell: Jev API 0/12 unexpected allows and 12/12 control interruptions; Laya GPU 0/12 unexpected allows and 12/12 control interruptions. Misleading assurance: Jev API 1/120 unexpected allows and 20/120 control interruptions; Laya GPU 11/120 unexpected allows and 75/120 control interruptions. Bars use 0–100% shares, not raw counts across differing denominators. One Laya encoded attack was rejected, not successfully classified. Jev still nearly saturates the plain attacks. These are correlated variants, not independent evidence.</desc>
