<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Warm classification latency: Jev API, Laya CPU and Laya GPU</title>
<rect width="1000" height="480" fill="var(--jv-bg, #fcfcfb)"/>
<text x="24" y="34" font-size="19" font-weight="650" fill="var(--jv-text, #0b0b0b)" letter-spacing="-0.01em">Warm classification latency</text>
<text x="24" y="58" font-size="13" fill="var(--jv-dim, #52514e)">Devious suite · two questions per request · local-rule decisions excluded · lower is faster</text>
