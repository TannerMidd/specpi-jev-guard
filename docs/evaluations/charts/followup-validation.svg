<title>No tuned preset qualified.</title><desc>BF16 baseline: 119/193 risky detected; 1467/4000 benign interrupted, including 1 fail-closed input rejection. FP32 diagnostic: 119/193 risky detected; 1482/4000 benign interrupted, including 1 fail-closed input rejection. One known overlap excluded from the original 4,194 TEST rows. No Jev or CPU run in this study. FP32 was frozen as a diagnostic after the development gate failed. On 48 authored contrasts both detected 17/24 risky cases and interrupted 15/24 benign ones. Source-derived labels and authored checks do not prove production safety. No tuned preset adopted.</desc>
