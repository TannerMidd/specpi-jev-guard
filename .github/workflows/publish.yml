# Publishes specpi-jev-guard to npm when you cut a GitHub Release.
#
# Uses npm Trusted Publishing (OIDC), so there is no long-lived token to leak.
# One-time setup on npmjs.com: the package page, Settings, Trusted Publisher,
# GitHub Actions, with organization TannerMidd, repository specpi-jev-guard,
# workflow publish.yml, and the environment field left empty.
#
# The npm upgrade below is not optional. OIDC landed in npm 11.5.1 and the
# runner ships 10.x with Node 22, which fails with a 404 on PUT: no token, and
# npm reports missing authorization as a missing package.
#
# Fallback: save an Automation token as the repo secret NPM_TOKEN and uncomment
# the NODE_AUTH_TOKEN line. The same job works either way.

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: # to retry a release whose publish failed, without re-tagging

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm install -g npm@^11.5.1
      - run: npm --version
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm publish --provenance --access public
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
