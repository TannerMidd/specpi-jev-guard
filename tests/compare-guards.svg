<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 548" width="1020" height="548" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The same commands run through both guards</title>
<rect width="1020" height="548" fill="var(--jv-bg, #fcfcfb)"/>
<text x="40" y="46" font-size="19" font-weight="650" fill="var(--jv-text, #0b0b0b)" letter-spacing="-0.01em">The same 784 commands, through both guards</text>
<text x="40" y="70" font-size="13" fill="var(--jv-dim, #52514e)">435 hostile commands and 349 ordinary ones, replayed against @gotgenes/pi-permission-system@33.0.3 and against this extension.</text>
<text x="40" y="90" font-size="13" fill="var(--jv-dim, #52514e)">Shorter is better in both panels. Nothing here was executed: each guard was asked what it would have done.</text>
<text x="300" y="170" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="650">Hostile commands that would have run</text>
<text x="300" y="188" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="start">out of 435</text>
<text x="640" y="170" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="650">Ordinary commands that interrupted you</text>
<text x="640" y="188" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="start">out of 349</text>
<rect x="640" y="121" width="11" height="11" rx="3" fill="var(--jv-ask, #fab219)"/>
<text x="657" y="130" font-size="12" fill="var(--jv-dim, #52514e)">asked you first</text>
<rect x="781.4" y="121" width="11" height="11" rx="3" fill="var(--jv-block, #d03b3b)"/>
<text x="798.4" y="130" font-size="12" fill="var(--jv-dim, #52514e)">refused outright</text>
<line x1="365.3" y1="198" x2="365.3" y2="440" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="430.6" y1="198" x2="430.6" y2="440" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="495.9" y1="198" x2="495.9" y2="440" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="561.1" y1="198" x2="561.1" y2="440" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="721.4" y1="198" x2="721.4" y2="440" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="802.8" y1="198" x2="802.8" y2="440" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="884.1" y1="198" x2="884.1" y2="440" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="300" y1="440" x2="584" y2="440" stroke="var(--jv-border, #c3c2b7)" stroke-width="1"/>
<line x1="640" y1="440" x2="924" y2="440" stroke="var(--jv-border, #c3c2b7)" stroke-width="1"/>
<text x="282" y="220" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="end" font-weight="600">pi-permission-system</text>
<text x="282" y="238" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="end">their README quick start</text>
<g class="mark-g"><title>0 of 435 hostile commands would have run</title><path class="mark" d="M300,208H300.8A0.8,0.8 0 0 1 301.5,208.8V233.3A0.8,0.8 0 0 1 300.8,234H300V208Z" fill="var(--jv-block, #d03b3b)"/>
</g>
<text x="310" y="226" font-size="13" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="700">0</text>
<g class="mark-g"><title>345 ordinary commands stopped to ask</title><path class="mark" d="M640,208H918.7V234H640V208Z" fill="var(--jv-ask, #fab219)"/>
</g>
<text x="780.4" y="226" font-size="12.5" fill="#1a1a19" text-anchor="middle" font-weight="700">345</text>
<g class="mark-g"><title>4 ordinary commands were refused outright</title><path class="mark" d="M920.7,208H922.4A1.6,1.6 0 0 1 924,209.6V232.4A1.6,1.6 0 0 1 922.4,234H920.7V208Z" fill="var(--jv-block, #d03b3b)"/>
</g>
<text x="934" y="226" font-size="12" fill="var(--jv-muted, #898781)" text-anchor="start">349 of 349</text>
<text x="282" y="282" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="end" font-weight="600">pi-permission-system</text>
<text x="282" y="300" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="end">a hardened policy, written for this test</text>
<g class="mark-g"><title>4 of 435 hostile commands would have run</title><path class="mark" d="M300,270H301.3A1.3,1.3 0 0 1 302.6,271.3V294.7A1.3,1.3 0 0 1 301.3,296H300V270Z" fill="var(--jv-block, #d03b3b)"/>
</g>
<text x="312.6" y="288" font-size="13" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="700">4</text>
<g class="mark-g"><title>334 ordinary commands stopped to ask</title><path class="mark" d="M640,270H909.8V296H640V270Z" fill="var(--jv-ask, #fab219)"/>
</g>
<text x="775.9" y="288" font-size="12.5" fill="#1a1a19" text-anchor="middle" font-weight="700">334</text>
<g class="mark-g"><title>12 ordinary commands were refused outright</title><path class="mark" d="M911.8,270H917.6A4,4 0 0 1 921.6,274V292A4,4 0 0 1 917.6,296H911.8V270Z" fill="var(--jv-block, #d03b3b)"/>
</g>
<text x="931.6" y="288" font-size="12" fill="var(--jv-muted, #898781)" text-anchor="start">346 of 349</text>
<text x="282" y="344" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="end" font-weight="600">pi-permission-system</text>
<text x="282" y="362" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="end">allow by default, deny list only</text>
<g class="mark-g"><title>154 of 435 hostile commands would have run</title><path class="mark" d="M300,332H396.5A4,4 0 0 1 400.5,336V354A4,4 0 0 1 396.5,358H300V332Z" fill="var(--jv-block, #d03b3b)"/>
</g>
<text x="390.5" y="350" font-size="13" fill="#ffffff" text-anchor="end" font-weight="700">154</text>
<g class="mark-g"><title>170 ordinary commands stopped to ask</title><path class="mark" d="M640,332H776.3V358H640V332Z" fill="var(--jv-ask, #fab219)"/>
</g>
<text x="709.2" y="350" font-size="12.5" fill="#1a1a19" text-anchor="middle" font-weight="700">170</text>
<g class="mark-g"><title>12 ordinary commands were refused outright</title><path class="mark" d="M778.3,332H784.1A4,4 0 0 1 788.1,336V354A4,4 0 0 1 784.1,358H778.3V332Z" fill="var(--jv-block, #d03b3b)"/>
</g>
<text x="798.1" y="350" font-size="12" fill="var(--jv-muted, #898781)" text-anchor="start">182 of 349</text>
<text x="282" y="406" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="end" font-weight="700">specpi-jev-guard</text>
<text x="282" y="424" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="end">defaults: block at 0.80, ask at 0.35</text>
<g class="mark-g"><title>10 of 435 hostile commands would have run</title><path class="mark" d="M300,394H303.3A3.3,3.3 0 0 1 306.5,397.3V416.7A3.3,3.3 0 0 1 303.3,420H300V394Z" fill="var(--jv-block, #d03b3b)"/>
</g>
<text x="316.5" y="412" font-size="13" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="700">10</text>
<g class="mark-g"><title>51 ordinary commands stopped to ask</title><path class="mark" d="M640,394H679.5V420H640V394Z" fill="var(--jv-ask, #fab219)"/>
</g>
<text x="660.8" y="412" font-size="12.5" fill="#1a1a19" text-anchor="middle" font-weight="700">51</text>
<g class="mark-g"><title>11 ordinary commands were refused outright</title><path class="mark" d="M681.5,394H686.5A4,4 0 0 1 690.5,398V416A4,4 0 0 1 686.5,420H681.5V394Z" fill="var(--jv-block, #d03b3b)"/>
</g>
<text x="700.5" y="412" font-size="12" fill="var(--jv-muted, #898781)" text-anchor="start">62 of 349</text>
<text x="300" y="462" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="middle" font-variant-numeric="tabular-nums">0</text>
<text x="365.3" y="462" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="middle" font-variant-numeric="tabular-nums">100</text>
<text x="430.6" y="462" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="middle" font-variant-numeric="tabular-nums">200</text>
