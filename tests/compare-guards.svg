<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 548" width="1020" height="548" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The same commands run through both guards</title>
<rect width="1020" height="548" fill="var(--jv-bg, #fcfcfb)"/>
<text x="40" y="46" font-size="19" font-weight="650" fill="var(--jv-text, #0b0b0b)" letter-spacing="-0.01em">The same 114 commands, through both guards</text>
<text x="40" y="70" font-size="13" fill="var(--jv-dim, #52514e)">89 hostile commands and 25 ordinary ones, replayed against @gotgenes/pi-permission-system@33.0.3 and against this extension.</text>
<text x="40" y="90" font-size="13" fill="var(--jv-dim, #52514e)">Shorter is better in both panels. Nothing here was executed: each guard was asked what it would have done.</text>
<text x="300" y="170" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="650">Hostile commands that would have run</text>
<text x="300" y="188" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="start">out of 89</text>
<text x="658" y="170" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="650">Ordinary commands that interrupted you</text>
<text x="658" y="188" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="start">out of 25</text>
<rect x="658" y="121" width="11" height="11" rx="3" fill="var(--jv-ask, #fab219)"/>
<text x="675" y="130" font-size="12" fill="var(--jv-dim, #52514e)">asked you first</text>
<rect x="799.4" y="121" width="11" height="11" rx="3" fill="var(--jv-block, #d03b3b)"/>
<text x="816.4" y="130" font-size="12" fill="var(--jv-dim, #52514e)">refused outright</text>
<line x1="367.9" y1="198" x2="367.9" y2="440" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="435.7" y1="198" x2="435.7" y2="440" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="503.6" y1="198" x2="503.6" y2="440" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="571.5" y1="198" x2="571.5" y2="440" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="718.4" y1="198" x2="718.4" y2="440" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="778.8" y1="198" x2="778.8" y2="440" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="839.2" y1="198" x2="839.2" y2="440" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="899.6" y1="198" x2="899.6" y2="440" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="960" y1="198" x2="960" y2="440" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="300" y1="440" x2="602" y2="440" stroke="var(--jv-border, #c3c2b7)" stroke-width="1"/>
<line x1="658" y1="440" x2="960" y2="440" stroke="var(--jv-border, #c3c2b7)" stroke-width="1"/>
<text x="282" y="220" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="end" font-weight="600">pi-permission-system</text>
<text x="282" y="238" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="end">their README quick start</text>
<g class="mark-g"><title>0 of 89 hostile commands would have run</title><path class="mark" d="M300,208H300.8A0.8,0.8 0 0 1 301.5,208.8V233.3A0.8,0.8 0 0 1 300.8,234H300V208Z" fill="var(--jv-block, #d03b3b)"/>
</g>
<text x="310" y="226" font-size="13" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="700">0</text>
<g class="mark-g"><title>23 ordinary commands stopped to ask</title><path class="mark" d="M658,208H933.8V234H658V208Z" fill="var(--jv-ask, #fab219)"/>
</g>
<text x="796.9" y="226" font-size="12.5" fill="#1a1a19" text-anchor="middle" font-weight="700">23</text>
<g class="mark-g"><title>2 ordinary commands were refused outright</title><path class="mark" d="M935.8,208H956A4,4 0 0 1 960,212V230A4,4 0 0 1 956,234H935.8V208Z" fill="var(--jv-block, #d03b3b)"/>
</g>
<text x="970" y="226" font-size="12" fill="var(--jv-muted, #898781)" text-anchor="start">25 of 25</text>
<text x="282" y="282" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="end" font-weight="600">pi-permission-system</text>
<text x="282" y="300" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="end">a hardened policy, written for this test</text>
<g class="mark-g"><title>1 of 89 hostile commands would have run</title><path class="mark" d="M300,270H301.7A1.7,1.7 0 0 1 303.4,271.7V294.3A1.7,1.7 0 0 1 301.7,296H300V270Z" fill="var(--jv-block, #d03b3b)"/>
</g>
<text x="313.4" y="288" font-size="13" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="700">1</text>
<g class="mark-g"><title>21 ordinary commands stopped to ask</title><path class="mark" d="M658,270H909.7V296H658V270Z" fill="var(--jv-ask, #fab219)"/>
</g>
<text x="784.8" y="288" font-size="12.5" fill="#1a1a19" text-anchor="middle" font-weight="700">21</text>
<g class="mark-g"><title>3 ordinary commands were refused outright</title><path class="mark" d="M911.7,270H943.9A4,4 0 0 1 947.9,274V292A4,4 0 0 1 943.9,296H911.7V270Z" fill="var(--jv-block, #d03b3b)"/>
</g>
<text x="929.8" y="288" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="957.9" y="288" font-size="12" fill="var(--jv-muted, #898781)" text-anchor="start">24 of 25</text>
<text x="282" y="344" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="end" font-weight="600">pi-permission-system</text>
<text x="282" y="362" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="end">allow by default, deny list only</text>
<g class="mark-g"><title>39 of 89 hostile commands would have run</title><path class="mark" d="M300,332H428.3A4,4 0 0 1 432.3,336V354A4,4 0 0 1 428.3,358H300V332Z" fill="var(--jv-block, #d03b3b)"/>
</g>
<text x="422.3" y="350" font-size="13" fill="#ffffff" text-anchor="end" font-weight="700">39</text>
<g class="mark-g"><title>5 ordinary commands stopped to ask</title><path class="mark" d="M658,332H716.4V358H658V332Z" fill="var(--jv-ask, #fab219)"/>
</g>
<text x="688.2" y="350" font-size="12.5" fill="#1a1a19" text-anchor="middle" font-weight="700">5</text>
<g class="mark-g"><title>3 ordinary commands were refused outright</title><path class="mark" d="M718.4,332H750.6A4,4 0 0 1 754.6,336V354A4,4 0 0 1 750.6,358H718.4V332Z" fill="var(--jv-block, #d03b3b)"/>
</g>
<text x="736.5" y="350" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="764.6" y="350" font-size="12" fill="var(--jv-muted, #898781)" text-anchor="start">8 of 25</text>
<text x="282" y="406" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="end" font-weight="700">specpi-jev-guard</text>
<text x="282" y="424" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="end">defaults: block at 0.80, ask at 0.35</text>
<g class="mark-g"><title>3 of 89 hostile commands would have run</title><path class="mark" d="M300,394H306.2A4,4 0 0 1 310.2,398V416A4,4 0 0 1 306.2,420H300V394Z" fill="var(--jv-block, #d03b3b)"/>
</g>
<text x="320.2" y="412" font-size="13" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="700">3</text>
<g class="mark-g"><title>14 ordinary commands stopped to ask</title><path class="mark" d="M658,394H823.1A4,4 0 0 1 827.1,398V416A4,4 0 0 1 823.1,420H658V394Z" fill="var(--jv-ask, #fab219)"/>
</g>
<text x="742.6" y="412" font-size="12.5" fill="#1a1a19" text-anchor="middle" font-weight="700">14</text>
<text x="837.1" y="412" font-size="12" fill="var(--jv-muted, #898781)" text-anchor="start">14 of 25</text>
