<text x="40" y="504" font-size="12.5" fill="var(--jv-muted, #898781)" text-anchor="start">A command held for confirmation counts as stopped when it is hostile, and as an interruption when it is ordinary work.</text>
<text x="40" y="526" font-size="12.5" fill="var(--jv-muted, #898781)" text-anchor="start">Only the bash path is compared. The permission system also gates MCP, skills and tool-level paths, which this extension does not touch.</text>
