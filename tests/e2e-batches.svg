<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 488" width="1020" height="488" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Scenarios run in each area of the extension</title>
<rect width="1020" height="488" fill="var(--jv-bg, #fcfcfb)"/>
<text x="40" y="46" font-size="19" font-weight="650" fill="var(--jv-text, #0b0b0b)" letter-spacing="-0.01em">48 scenarios, run against a real pi installation</text>
<text x="40" y="70" font-size="13" fill="var(--jv-dim, #52514e)">Every one drives the packed extension inside a sandboxed pi, with deepseek/deepseek-v4.1-flash proposing the calls.</text>
<text x="40" y="90" font-size="13" fill="var(--jv-dim, #52514e)">Longer is more coverage. Red is a scenario that did not do what it should.</text>
<rect x="330" y="109" width="11" height="11" rx="3" fill="var(--jv-allow, #0ca30c)"/>
<text x="347" y="118" font-size="12" fill="var(--jv-dim, #52514e)">behaved as specified</text>
<rect x="506.2" y="109" width="11" height="11" rx="3" fill="var(--jv-block, #d03b3b)"/>
<text x="523.2" y="118" font-size="12" fill="var(--jv-dim, #52514e)">did not</text>
<rect x="591.9" y="109" width="11" height="11" rx="3" fill="var(--jv-muted, #898781)"/>
<text x="608.9" y="118" font-size="12" fill="var(--jv-dim, #52514e)">not exercised: the agent declined</text>
<line x1="530" y1="158" x2="530" y2="400" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="730" y1="158" x2="730" y2="400" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="930" y1="158" x2="930" y2="400" stroke="var(--jv-grid, #e1e0d9)" stroke-width="1"/>
<line x1="330" y1="400" x2="930" y2="400" stroke="var(--jv-border, #c3c2b7)" stroke-width="1"/>
<text x="312" y="182" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="end" font-weight="650">The commands you type</text>
<text x="312" y="200" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="end">/jev-guard status, check, on, off, model, backend</text>
<g class="mark-g"><title>15 scenarios behaved as specified</title><path class="mark" d="M330,170H926A4,4 0 0 1 930,174V192A4,4 0 0 1 926,196H330V170Z" fill="var(--jv-allow, #0ca30c)"/>
</g>
<text x="630" y="188" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="700">15</text>
<text x="942" y="188" font-size="12" fill="var(--jv-muted, #898781)" text-anchor="start">15 scenarios</text>
<text x="312" y="244" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="end" font-weight="650">The gate itself</text>
<text x="312" y="262" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="end">a real agent proposing real tool calls</text>
<g class="mark-g"><title>12 scenarios behaved as specified</title><path class="mark" d="M330,232H808V258H330V232Z" fill="var(--jv-allow, #0ca30c)"/>
</g>
<text x="570" y="250" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="700">12</text>
<g class="mark-g"><title>1 scenario was not exercised</title><path class="mark" d="M810,232H846A4,4 0 0 1 850,236V254A4,4 0 0 1 846,258H810V232Z" fill="var(--jv-muted, #898781)"/>
</g>
<text x="830" y="250" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="862" y="250" font-size="12" fill="var(--jv-muted, #898781)" text-anchor="start">13 scenarios</text>
<text x="312" y="306" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="end" font-weight="650">When things go wrong</text>
<text x="312" y="324" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="end">no key, no network, a timeout, odd config</text>
<g class="mark-g"><title>14 scenarios behaved as specified</title><path class="mark" d="M330,294H886A4,4 0 0 1 890,298V316A4,4 0 0 1 886,320H330V294Z" fill="var(--jv-allow, #0ca30c)"/>
</g>
<text x="610" y="312" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="700">14</text>
<text x="902" y="312" font-size="12" fill="var(--jv-muted, #898781)" text-anchor="start">14 scenarios</text>
<text x="312" y="368" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="end" font-weight="650">Getting started</text>
<text x="312" y="386" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="end">the install commands and the guided setup</text>
<g class="mark-g"><title>6 scenarios behaved as specified</title><path class="mark" d="M330,356H566A4,4 0 0 1 570,360V378A4,4 0 0 1 566,382H330V356Z" fill="var(--jv-allow, #0ca30c)"/>
</g>
<text x="450" y="374" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="700">6</text>
<text x="582" y="374" font-size="12" fill="var(--jv-muted, #898781)" text-anchor="start">6 scenarios</text>
<text x="330" y="422" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="middle" font-variant-numeric="tabular-nums">0</text>
<text x="530" y="422" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="middle" font-variant-numeric="tabular-nums">5</text>
<text x="730" y="422" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="middle" font-variant-numeric="tabular-nums">10</text>
<text x="930" y="422" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="middle" font-variant-numeric="tabular-nums">15</text>
</svg>
