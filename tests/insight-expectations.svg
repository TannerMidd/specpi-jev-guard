<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="634" viewBox="0 0 1060 634" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1060" height="634" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#111827">Where the model disagreed with intuition</text>
<text x="24" y="58" font-size="13" fill="#6b7280">10 of 124 commands landed in a different band than expected. These are the calibration targets, not errors.</text>
<text x="24" y="78" font-size="13" fill="#6b7280">Each row shows the band we predicted against the band Jev produced — use them to sanity-check thresholds.</text>
<rect x="24" y="108" width="1012" height="36" rx="6" fill="#f8fafc"/>
<text x="40.0" y="128.0" font-size="12.5" fill="#111827" text-anchor="start">git rebase -i HEAD~5</text>
<text x="760.0" y="128.0" font-size="11.5" fill="#6b7280" text-anchor="end">expected ask</text>
<text x="870.0" y="128.0" font-size="12.5" fill="#22c55e" text-anchor="end" font-weight="700">got allow</text>
<text x="1020.0" y="128.0" font-size="12.5" fill="#6b7280" text-anchor="end">0.29</text>
<rect x="24" y="152" width="1012" height="36" rx="6" fill="#f8fafc"/>
