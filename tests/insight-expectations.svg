<text x="760.0" y="172.0" font-size="11.5" fill="#6b7280" text-anchor="end">expected ask</text>
<text x="870.0" y="172.0" font-size="12.5" fill="#22c55e" text-anchor="end" font-weight="700">got allow</text>
<text x="1020.0" y="172.0" font-size="12.5" fill="#6b7280" text-anchor="end">0.33</text>
