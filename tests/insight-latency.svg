<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 510" width="1060" height="510" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1060" height="510" fill="var(--jv-bg, #fcfcfb)"/>
<text x="24" y="34" font-size="19" font-weight="650" fill="var(--jv-text, #0b0b0b)" letter-spacing="-0.01em">How long Jev takes to answer</text>
