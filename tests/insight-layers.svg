<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 526" width="1060" height="526" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1060" height="526" fill="var(--jv-bg, #fcfcfb)"/>
<text x="24" y="34" font-size="19" font-weight="650" fill="var(--jv-text, #0b0b0b)" letter-spacing="-0.01em">Which layer decided, and what it cost</text>
<text x="24" y="58" font-size="13" fill="var(--jv-dim, #52514e)">124 commands: 37 settled locally in 0 ms, 87 needed the classifier.</text>
<text x="24" y="78" font-size="13" fill="var(--jv-dim, #52514e)">Local rules cannot be overruled by the model: a hard-deny stays denied even if Jev would have waved it through.</text>
<rect x="24" y="128" width="1012" height="92" rx="10" fill="var(--jv-panel, #f2f1ee)" stroke="var(--jv-border, #c3c2b7)" stroke-width="1"/>
<rect x="24" y="128" width="6" height="92" rx="3" fill="var(--jv-block, #d03b3b)"/>
<text x="52" y="162" font-size="15" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="700">Local rules: hard-deny</text>
<text x="52" y="186" font-size="12" fill="var(--jv-dim, #52514e)" text-anchor="start">blocked before any network call</text>
<text x="1008" y="168" font-size="30" fill="var(--jv-block, #d03b3b)" text-anchor="end" font-weight="700">19</text>
<text x="1008" y="190" font-size="12" fill="var(--jv-dim, #52514e)" text-anchor="end">0 ms</text>
<g class="mark-g"><title>Local rules: hard-deny: 15% of all commands</title><path class="mark" d="M52,200H164.5A4,4 0 0 1 168.5,204V204A4,4 0 0 1 164.5,208H52V200Z" fill="var(--jv-block, #d03b3b)"/>
</g>
<text x="176.5" y="208" font-size="11" fill="var(--jv-dim, #52514e)" text-anchor="start">15%</text>
<rect x="24" y="236" width="1012" height="92" rx="10" fill="var(--jv-panel, #f2f1ee)" stroke="var(--jv-border, #c3c2b7)" stroke-width="1"/>
<rect x="24" y="236" width="6" height="92" rx="3" fill="var(--jv-allow, #0ca30c)"/>
<text x="52" y="270" font-size="15" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="700">Local rules: read-only fast-pass</text>
<text x="52" y="294" font-size="12" fill="var(--jv-dim, #52514e)" text-anchor="start">runs with zero added latency</text>
<text x="1008" y="276" font-size="30" fill="var(--jv-allow, #0ca30c)" text-anchor="end" font-weight="700">18</text>
<text x="1008" y="298" font-size="12" fill="var(--jv-dim, #52514e)" text-anchor="end">0 ms</text>
<g class="mark-g"><title>Local rules: read-only fast-pass: 15% of all commands</title><path class="mark" d="M52,308H158.3A4,4 0 0 1 162.3,312V312A4,4 0 0 1 158.3,316H52V308Z" fill="var(--jv-allow, #0ca30c)"/>
</g>
<text x="170.3" y="316" font-size="11" fill="var(--jv-dim, #52514e)" text-anchor="start">15%</text>
<rect x="24" y="344" width="1012" height="92" rx="10" fill="var(--jv-panel, #f2f1ee)" stroke="var(--jv-border, #c3c2b7)" stroke-width="1"/>
<rect x="24" y="344" width="6" height="92" rx="3" fill="var(--jv-accent, #2a78d6)"/>
<text x="52" y="378" font-size="15" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="700">Sent to Jev</text>
<text x="52" y="402" font-size="12" fill="var(--jv-dim, #52514e)" text-anchor="start">avg 386ms, p95 758ms</text>
<text x="1008" y="384" font-size="30" fill="var(--jv-accent, #2a78d6)" text-anchor="end" font-weight="700">87</text>
<text x="1008" y="406" font-size="12" fill="var(--jv-dim, #52514e)" text-anchor="end">386 ms avg</text>
<g class="mark-g"><title>Sent to Jev: 70% of all commands</title><path class="mark" d="M52,416H581.2A4,4 0 0 1 585.2,420V420A4,4 0 0 1 581.2,424H52V416Z" fill="var(--jv-accent, #2a78d6)"/>
</g>
<text x="593.2" y="424" font-size="11" fill="var(--jv-dim, #52514e)" text-anchor="start">70%</text>
<text x="24" y="496" font-size="11.5" fill="var(--jv-dim, #52514e)" text-anchor="start">15% of commands were stopped instantly (0 ms) with no data leaving the machine.</text>
<text x="24" y="512" font-size="11.5" fill="var(--jv-dim, #52514e)" text-anchor="start">70% were judged by Jev; 87 of those returned a verdict, and any failure there fails closed.</text>
