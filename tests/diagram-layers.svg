<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 490" width="1020" height="490" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Where each of the 471 hostile attempts was stopped</title>
<rect width="1020" height="490" fill="var(--jv-bg, #fcfcfb)"/>
<text x="40" y="46" font-size="19" font-weight="650" fill="var(--jv-text, #0b0b0b)" letter-spacing="-0.01em">Where the 471 attacks were stopped</text>
<text x="40" y="70" font-size="13" fill="var(--jv-dim, #52514e)">Each bar is the same 471 hostile attempts, split two different ways. Segment width is the number of attempts.</text>
<text x="60" y="136" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="650">Which layer stopped it</text>
<g class="mark-g"><title>21 of 471: stopped by local rules, 0 ms</title><path class="mark" d="M66,150H97.1V216H66A6,6 0 0 1 60,210V156A6,6 0 0 1 66,150Z" fill="var(--jv-accent, #2a78d6)"/></g>
<g class="mark-g"><title>440 of 471: stopped by Jev, about 258 ms each</title><path class="mark" d="M100.1,150H937.9V216H100.1V150Z" fill="var(--jv-accent, #2a78d6)" opacity="0.45"/></g>
<text x="520.5" y="191" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">440</text>
<g class="mark-g"><title>10 of 471: got past both</title><path class="mark" d="M940.9,150H954A6,6 0 0 1 960,156V210A6,6 0 0 1 954,216H940.9V150Z" fill="var(--jv-muted, #898781)"/></g>
<rect x="60.0" y="232" width="12" height="12" rx="3" fill="var(--jv-accent, #2a78d6)"/>
<text x="79" y="242" font-size="13" fill="var(--jv-text, #0b0b0b)" text-anchor="start">21 stopped by local rules, 0 ms</text>
<rect x="342.7" y="232" width="12" height="12" rx="3" fill="var(--jv-accent, #2a78d6)" opacity="0.45"/>
<text x="361.7" y="242" font-size="13" fill="var(--jv-text, #0b0b0b)" text-anchor="start">440 stopped by Jev, about 258 ms each</text>
<rect x="670.7" y="232" width="12" height="12" rx="3" fill="var(--jv-muted, #898781)"/>
<text x="689.7" y="242" font-size="13" fill="var(--jv-text, #0b0b0b)" text-anchor="start">10 got past both</text>
<text x="60" y="286" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="650">What the guard did with them</text>
<g class="mark-g"><title>379 of 471: blocked, the command never runs</title><path class="mark" d="M66,300H781.2V366H66A6,6 0 0 1 60,360V306A6,6 0 0 1 66,300Z" fill="var(--jv-block, #d03b3b)"/></g>
<text x="422.1" y="341" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">379</text>
<g class="mark-g"><title>82 of 471: held, asks you first</title><path class="mark" d="M784.2,300H937.9V366H784.2V300Z" fill="var(--jv-ask, #fab219)"/></g>
<text x="862.5" y="341" font-size="22" fill="#1a1a19" text-anchor="middle" font-weight="700">82</text>
<g class="mark-g"><title>10 of 471: allowed</title><path class="mark" d="M940.9,300H954A6,6 0 0 1 960,306V360A6,6 0 0 1 954,366H940.9V300Z" fill="var(--jv-allow, #0ca30c)"/></g>
<rect x="60.0" y="382" width="12" height="12" rx="3" fill="var(--jv-block, #d03b3b)"/>
<text x="79" y="392" font-size="13" fill="var(--jv-text, #0b0b0b)" text-anchor="start">379 blocked, the command never runs</text>
<rect x="372.9" y="382" width="12" height="12" rx="3" fill="var(--jv-ask, #fab219)"/>
<text x="391.9" y="392" font-size="13" fill="var(--jv-text, #0b0b0b)" text-anchor="start">82 held, asks you first</text>
<rect x="595.3" y="382" width="12" height="12" rx="3" fill="var(--jv-allow, #0ca30c)"/>
<text x="614.3" y="392" font-size="13" fill="var(--jv-text, #0b0b0b)" text-anchor="start">10 allowed</text>
<text x="40" y="444" font-size="12.5" fill="var(--jv-muted, #898781)" text-anchor="start">Held blocks outright when nobody is there to answer, so an unattended agent stops 461 of 471.</text>
<text x="40" y="466" font-size="12.5" fill="var(--jv-muted, #898781)" text-anchor="start">The 10 attempts that got past both are listed, with their scores, further down the page.</text>
</svg>
