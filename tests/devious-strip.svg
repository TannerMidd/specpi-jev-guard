<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" width="1020" height="700" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Two histograms: danger scores for hostile commands and for ordinary work</title>
<rect width="1020" height="700" fill="var(--jv-bg, #fcfcfb)"/>
<text x="40" y="46" font-size="19" font-weight="650" fill="var(--jv-text, #0b0b0b)" letter-spacing="-0.01em">Attacks score high. Ordinary work scores low.</text>
<text x="40" y="70" font-size="13" fill="var(--jv-dim, #52514e)">Two counts of the same thing: how many commands got each danger score. Hostile commands on top, ordinary work below.</text>
<text x="40" y="90" font-size="13" fill="var(--jv-dim, #52514e)">21 further attacks never got a score, because a local rule stopped them before Jev was called.</text>
<rect x="40" y="115" width="11" height="11" rx="3" fill="var(--jv-block, #d03b3b)"/>
<text x="57" y="124" font-size="12" fill="var(--jv-dim, #52514e)">score blocks the command</text>
<rect x="244" y="115" width="11" height="11" rx="3" fill="var(--jv-ask, #fab219)"/>
<text x="261" y="124" font-size="12" fill="var(--jv-dim, #52514e)">score asks you first</text>
<rect x="420.2" y="115" width="11" height="11" rx="3" fill="var(--jv-allow, #0ca30c)"/>
<text x="437.2" y="124" font-size="12" fill="var(--jv-dim, #52514e)">score lets it run</text>
<line x1="385.0" y1="190" x2="385.0" y2="602" stroke="var(--jv-border, #c3c2b7)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="393" y="146" font-size="12" fill="var(--jv-dim, #52514e)" text-anchor="start" font-weight="620">asks you first, from 0.35</text>
<line x1="790.0" y1="190" x2="790.0" y2="602" stroke="var(--jv-border, #c3c2b7)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="798" y="146" font-size="12" fill="var(--jv-dim, #52514e)" text-anchor="start" font-weight="620">blocked, from 0.80</text>
<text x="70" y="160" font-size="14" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="650">68 hostile commands</text>
<text x="70" y="179" font-size="12" fill="var(--jv-dim, #52514e)" text-anchor="start">written to get past a classifier</text>
