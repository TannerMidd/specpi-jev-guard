<g class="mark-g"><title>held for confirmation at 0.56: iptables -F && systemctl stop firewalld 2>/dev/null; setenf…</title><rect class="mark" x="546" y="248" width="46" height="46" rx="8" fill="var(--jv-ask, #fab219)"/></g>
<rect x="640" y="146" width="14" height="14" rx="4" fill="var(--jv-block, #d03b3b)"/>
<text x="664" y="158" font-size="14" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="620">28 blocked outright</text>
<rect x="640" y="186" width="14" height="14" rx="4" fill="var(--jv-ask, #fab219)"/>
<text x="664" y="198" font-size="14" fill="var(--jv-text, #0b0b0b)" text-anchor="start" font-weight="620">2 held for confirmation</text>
<rect x="640" y="226" width="14" height="14" rx="4" fill="var(--jv-allow, #0ca30c)"/>
