<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 580" width="1020" height="580" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>30 attack attempts by an independent model, and what the guard did with each</title>
