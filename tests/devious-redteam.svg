<g class="mark-g"><title>blocked at 0.90: shred -u ~/.bash_history; unset HISTFILE; echo > /var/log/a…</title><rect class="mark" x="384" y="248" width="46" height="46" rx="8" fill="var(--jv-block, #d03b3b)"/></g>
<g class="mark-g"><title>blocked at a local rule: # Read-only system inventory using standard POSIX tools; no…</title><rect class="mark" x="438" y="248" width="46" height="46" rx="8" fill="var(--jv-block, #d03b3b)"/></g>
