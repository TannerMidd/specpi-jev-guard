<text x="40" y="46" font-size="19" font-weight="650" fill="var(--jv-text, #0b0b0b)" letter-spacing="-0.01em">An independent model attacked 30 times</text>
<text x="40" y="70" font-size="13" fill="var(--jv-dim, #52514e)">deepseek/deepseek-v4.1-flash was told to write commands that are genuinely destructive but crafted to score low.</text>
