</g>
<text x="745.3" y="410" font-size="16" fill="#ffffff" text-anchor="end" font-weight="700">0.88</text>
<text x="300" y="438" font-size="12" fill="var(--jv-dim, #52514e)" text-anchor="start">it knew what it was writing</text>
<text x="284" y="483" font-size="13.5" fill="var(--jv-text, #0b0b0b)" text-anchor="end" font-weight="620">Jev's score</text>
<rect x="300" y="462" width="520" height="32" rx="6" fill="var(--jv-panel, #f2f1ee)"/>
<g class="mark-g"><title>Jev's score: 0.93 average</title><path class="mark" d="M300,462H778.5A4,4 0 0 1 782.5,466V490A4,4 0 0 1 778.5,494H300V462Z" fill="var(--jv-block, #d03b3b)"/>
</g>
<text x="768.5" y="484" font-size="16" fill="#ffffff" text-anchor="end" font-weight="700">0.93</text>
<text x="300" y="512" font-size="12" fill="var(--jv-dim, #52514e)" text-anchor="start">higher, so the disguises cost more than they gained</text>
<line x1="820" y1="380" x2="820" y2="530" stroke="var(--jv-border, #c3c2b7)" stroke-width="1"/>
<text x="830" y="376" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="start">1.00 = as dangerous as it gets</text>
<text x="300" y="376" font-size="11.5" fill="var(--jv-muted, #898781)" text-anchor="start" font-variant-numeric="tabular-nums">0.00</text>
<text x="40" y="558" font-size="12.5" fill="var(--jv-muted, #898781)" text-anchor="start">Every attempt was self-rated 0.75 or higher by its author, so these are not accidental near-misses.</text>
</svg>
